name: Security checks

# Runs on every push/PR and weekly. Fails the build if any restored NuGet
# package (direct or transitive) has a known vulnerability advisory.
# Substitutes for GitHub-only CodeQL on this Forgejo-hosted repo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  vulnerable-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5.3.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore jellyfin-plugin-oidc.sln

      - name: List vulnerable packages
        run: |
          set -e
          OUT=$(dotnet list jellyfin-plugin-oidc.sln package --vulnerable --include-transitive 2>&1 || true)
          echo "$OUT"
          # `dotnet list package --vulnerable` prints a "has the following vulnerable packages"
          # line per project when findings exist. Match that to fail the job.
          if echo "$OUT" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5.3.0
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build jellyfin-plugin-oidc.sln -c Release --nologo

      - name: Test
        run: dotnet test jellyfin-plugin-oidc.sln -c Release --no-build --nologo
