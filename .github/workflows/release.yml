name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true
  push:
    tags:
      - "v*"

# Default to read-only. The push-manifest job below overrides with contents: write.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create the GitHub Release and push manifest update
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Validate release branch
        # Only allow releases from the main branch or tag pushes.
        # Fail fast rather than silently committing to the wrong branch.
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # Tag push: GITHUB_REF_NAME is the tag (e.g. v0.1.2), which is always valid.
            echo "Tag push: ${GITHUB_REF_NAME} — OK"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::workflow_dispatch releases must be triggered from main, got: ${GITHUB_REF_NAME}"
              exit 1
            fi
            echo "workflow_dispatch from main — OK"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          VERSION="${{ steps.version.outputs.version }}.0"
          dotnet publish Jellyfin.Plugin.OIDC/Jellyfin.Plugin.OIDC.csproj \
            -c Release -o dist \
            -p:Version=$VERSION \
            -p:AssemblyVersion=$VERSION \
            -p:FileVersion=$VERSION

      - name: Package
        run: cd dist && zip ../oidc-rbac.zip -- *.dll meta.json

      - name: Compute checksums
        run: |
          # NOTE: Jellyfin's InstallationManager (Emby.Server.Implementations/Updates/InstallationManager.cs)
          # validates plugin packages using MD5 (MD5.HashDataAsync) and compares against the manifest
          # "checksum" field. This is acknowledged as broken crypto in Jellyfin's own source with a
          # #pragma disable CA5351 suppression. We cannot migrate to SHA-256 here without a matching
          # server-side change in Jellyfin. The MD5 here is for plugin-loader integrity only, not
          # used for security authentication.
          #
          # SHA-256 is recorded alongside for informational purposes and future use.
          MD5_CHECKSUM=$(md5sum oidc-rbac.zip | cut -d' ' -f1)
          SHA256_CHECKSUM=$(sha256sum oidc-rbac.zip | cut -d' ' -f1)
          echo "md5_checksum=${MD5_CHECKSUM}" >> "$GITHUB_OUTPUT"
          echo "sha256_checksum=${SHA256_CHECKSUM}" >> "$GITHUB_OUTPUT"
          echo "MD5 (Jellyfin manifest): ${MD5_CHECKSUM}"
          echo "SHA-256 (informational): ${SHA256_CHECKSUM}"
        id: checksums

      - name: Update manifest.json
        run: |
          CHECKSUM="${{ steps.checksums.outputs.md5_checksum }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          VERSION="${{ steps.version.outputs.version }}.0"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/oidc-rbac.zip"

          # manifest.json lives on its own orphan `manifest` branch so releases
          # don't churn main. Fetch the current manifest from that branch; if the
          # branch doesn't exist yet, seed an empty manifest skeleton.
          if git fetch origin manifest 2>/dev/null && git show origin/manifest:manifest.json > manifest.json 2>/dev/null; then
            echo "Loaded manifest.json from origin/manifest"
          else
            echo "No origin/manifest branch yet — seeding empty manifest"
            jq -n '[{
              guid: "d4e5f6a7-b8c9-0d1e-2f3a-4b5c6d7e8f90",
              name: "OIDC RBAC",
              description: "Advanced OIDC authentication with role-based library access control",
              overview: "OpenID Connect SSO with role-to-library mapping, multi-provider support, and admin UI.",
              owner: "LeaderbotX400",
              category: "Authentication",
              versions: []
            }]' > manifest.json
          fi

          NEW_ENTRY=$(jq -n \
            --arg v "$VERSION" \
            --arg c "Release ${GITHUB_REF_NAME}" \
            --arg u "$DOWNLOAD_URL" \
            --arg h "$CHECKSUM" \
            --arg t "$TIMESTAMP" \
            '{version: $v, changelog: $c, targetAbi: "10.11.0.0", sourceUrl: $u, checksum: $h, timestamp: $t}')

          # Prepend new version to existing manifest, deduping by version (re-tag overwrites)
          jq --argjson new "$NEW_ENTRY" --arg v "$VERSION" '
            .[0].versions = ([$new] + (.[0].versions | map(select(.version != $v))))
          ' manifest.json > manifest.json.new
          mv manifest.json.new manifest.json

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: oidc-rbac.zip
          generate_release_notes: true

      - name: Verify all manifest sourceUrls are reachable
        run: |
          # Guard against stale entries (deleted/renamed releases) silently
          # poisoning the manifest. Fail the job before we commit if any
          # listed asset 404s — including the one we just published, which
          # catches GitHub's release-asset propagation lag.
          fail=0
          for url in $(jq -r '.[0].versions[].sourceUrl' manifest.json); do
            for attempt in 1 2 3; do
              code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 15 "$url" || echo 000)
              if [ "$code" = "200" ]; then
                echo "OK  $url"
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "retry $attempt: $code $url"
                sleep $((attempt * 3))
              else
                echo "::error::Unreachable ($code): $url"
                fail=1
              fi
            done
          done
          exit $fail

      - name: Commit updated manifest to manifest branch
        # manifest.json lives on its own orphan `manifest` branch so the release
        # workflow doesn't churn main. The branch contains only manifest.json
        # (no source, no history from main). Jellyfin consumers point at the
        # raw URL on the `manifest` branch.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp manifest.json /tmp/manifest.json

          if git ls-remote --exit-code --heads origin manifest >/dev/null 2>&1; then
            git fetch origin manifest
            # -f discards anything dirty from the tag checkout
            git checkout -f -B manifest origin/manifest
          else
            echo "Creating orphan manifest branch"
            git checkout --orphan manifest
            git rm -rf --cached . >/dev/null 2>&1 || true
            # Wipe the working tree so the orphan branch contains only manifest.json
            find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          fi

          cp /tmp/manifest.json manifest.json
          git add manifest.json
          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
            exit 0
          fi
          git commit -m "Update manifest.json for ${GITHUB_REF_NAME}"
          # Retry to survive concurrent pushes during the build.
          # No --force: this job is the only manifest writer. If a concurrent push
          # exists, rebase + retry cleanly; do NOT swallow rebase failures.
          for i in 1 2 3; do
            if git push origin manifest; then
              exit 0
            fi
            echo "Push failed, rebasing and retrying ($i/3)..."
            git pull --rebase origin manifest
            sleep $((i * 2))
          done
          echo "::error::Failed to push manifest update after 3 attempts"
          exit 1
