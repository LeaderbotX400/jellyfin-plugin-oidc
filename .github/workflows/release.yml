name: Build & Release

# Forgejo Actions variant of .github/workflows/release.yml, targeting the
# self-hosted instance at forgejo.singerfamily.ca.
#
# Key differences from the GitHub workflow:
#   - Actions are referenced by full https://github.com/... URLs so the original
#     SHA pins still apply (Forgejo's default action registry, code.forgejo.org,
#     does not mirror setup-dotnet).
#   - The GitHub-only softprops/action-gh-release step is replaced by
#     actions/forgejo-release (Forgejo's first-party release action).
#   - Download/server URLs use ${{ github.server_url }}, which Forgejo populates
#     with the instance URL, instead of a literal https://github.com.
#
# NOTE: Forgejo also scans .github/workflows by default, so the original
# release.yml will ALSO try to run here and fail. Delete .github/workflows/release.yml
# (or disable .github scanning) if Forgejo is the only forge for this repo.
#
# NOTE: the manifest approach requires the repo's releases to be publicly
# readable — the Jellyfin consumer and the reachability check below fetch the
# asset without auth.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true
  push:
    tags:
      - "v*"

# Default to read-only. The release job below overrides with contents: write.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create the release and push the manifest update
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4.3.1

      - name: Ensure CLI tooling (zip, jq)
        # The default Forgejo runner image (node:bookworm) ships curl/git/md5sum
        # but not zip or jq. Install them if absent. Adjust if your runner uses a
        # non-Debian base image.
        run: |
          set -eu
          if ! command -v zip >/dev/null || ! command -v jq >/dev/null; then
            SUDO=""
            [ "$(id -u)" -ne 0 ] && SUDO=sudo
            $SUDO apt-get update
            $SUDO apt-get install -y zip jq
          fi

      - name: Validate release branch
        # Only allow releases from the main branch or tag pushes.
        # Fail fast rather than silently committing to the wrong branch.
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # Tag push: GITHUB_REF_NAME is the tag (e.g. v0.1.2), which is always valid.
            echo "Tag push: ${GITHUB_REF_NAME} — OK"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::workflow_dispatch releases must be triggered from main, got: ${GITHUB_REF_NAME}"
              exit 1
            fi
            echo "workflow_dispatch from main — OK"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5.3.0
        with:
          dotnet-version: "10.0.x"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          VERSION="${{ steps.version.outputs.version }}.0"
          dotnet publish Jellyfin.Plugin.OIDC/Jellyfin.Plugin.OIDC.csproj \
            -c Release -o dist \
            -p:Version=$VERSION \
            -p:AssemblyVersion=$VERSION \
            -p:FileVersion=$VERSION

      - name: Package
        # Stage the zip into release-staging/ because actions/forgejo-release uploads
        # everything in a directory (no per-file input). Keep the artifact out of
        # dist/ so we don't accidentally upload the unzipped publish output.
        run: |
          mkdir -p release-staging
          cd dist && zip ../release-staging/oidc-rbac.zip -- *.dll meta.json

      - name: Compute checksums
        run: |
          # NOTE: Jellyfin's InstallationManager (Emby.Server.Implementations/Updates/InstallationManager.cs)
          # validates plugin packages using MD5 (MD5.HashDataAsync) and compares against the manifest
          # "checksum" field. This is acknowledged as broken crypto in Jellyfin's own source with a
          # #pragma disable CA5351 suppression. We cannot migrate to SHA-256 here without a matching
          # server-side change in Jellyfin. The MD5 here is for plugin-loader integrity only, not
          # used for security authentication.
          #
          # SHA-256 is recorded alongside for informational purposes and future use.
          MD5_CHECKSUM=$(md5sum release-staging/oidc-rbac.zip | cut -d' ' -f1)
          SHA256_CHECKSUM=$(sha256sum release-staging/oidc-rbac.zip | cut -d' ' -f1)
          echo "md5_checksum=${MD5_CHECKSUM}" >> "$GITHUB_OUTPUT"
          echo "sha256_checksum=${SHA256_CHECKSUM}" >> "$GITHUB_OUTPUT"
          echo "MD5 (Jellyfin manifest): ${MD5_CHECKSUM}"
          echo "SHA-256 (informational): ${SHA256_CHECKSUM}"
        id: checksums

      - name: Update manifest.json
        run: |
          CHECKSUM="${{ steps.checksums.outputs.md5_checksum }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          VERSION="${{ steps.version.outputs.version }}.0"
          DOWNLOAD_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/oidc-rbac.zip"

          # manifest.json lives on its own orphan `manifest` branch so releases
          # don't churn main. Fetch the current manifest from that branch; if the
          # branch doesn't exist yet, seed an empty manifest skeleton.
          if git fetch origin manifest 2>/dev/null && git show origin/manifest:manifest.json > manifest.json 2>/dev/null; then
            echo "Loaded manifest.json from origin/manifest"
          else
            echo "No origin/manifest branch yet — seeding empty manifest"
            jq -n '[{
              guid: "d4e5f6a7-b8c9-0d1e-2f3a-4b5c6d7e8f90",
              name: "OIDC SSO",
              description: "Advanced OIDC authentication with role-based library access control",
              overview: "OpenID Connect SSO with role-to-library mapping, multi-provider support, and admin UI.",
              owner: "LeaderbotX400",
              category: "Authentication",
              versions: []
            }]' > manifest.json
          fi

          NEW_ENTRY=$(jq -n \
            --arg v "$VERSION" \
            --arg c "Release ${GITHUB_REF_NAME}" \
            --arg u "$DOWNLOAD_URL" \
            --arg h "$CHECKSUM" \
            --arg t "$TIMESTAMP" \
            '{version: $v, changelog: $c, targetAbi: "10.11.0.0", sourceUrl: $u, checksum: $h, timestamp: $t}')

          # Prepend new version to existing manifest, deduping by version (re-tag overwrites)
          jq --argjson new "$NEW_ENTRY" --arg v "$VERSION" '
            .[0].versions = ([$new] + (.[0].versions | map(select(.version != $v))))
          ' manifest.json > manifest.json.new
          mv manifest.json.new manifest.json

      - name: Create release
        # actions/forgejo-release uploads every file under release-dir (no per-file
        # input), so the Package step stages oidc-rbac.zip into release-staging/.
        # override: true makes re-runs idempotent — the release and asset get
        # overwritten instead of failing with "release already exists".
        #
        # NOTE: `tag` defaults to forge.ref_name. On a tag-push this is the tag
        # (correct). On workflow_dispatch from main this would be "main", which
        # would publish to a release named "main". The existing version-extraction
        # step (`${GITHUB_REF_NAME#v}`) is already broken for workflow_dispatch in
        # the same way; fix both together if/when dispatch-based releases are
        # actually wanted.
        uses: https://code.forgejo.org/actions/forgejo-release@v2.12.1
        with:
          # Hardcoded to the canonical instance URL. The runner sets
          # github.server_url to https://git.s10y.ca, which 302-redirects to
          # https://forgejo.singerfamily.ca. The action's internal `curl --fail`
          # does NOT pass -L, so it gets the 302 body ("Found") instead of JSON,
          # jq returns null for .commit.sha, and the tag-SHA-match check fails
          # with a misleading "tag SHA does not match" error. Bypass by pointing
          # straight at the canonical URL.
          url: https://forgejo.singerfamily.ca
          direction: upload
          release-dir: release-staging
          override: true
          token: ${{ secrets.GITHUB_TOKEN }}
          verbose: "true"

      - name: Verify all manifest sourceUrls are reachable
        run: |
          # Guard against stale entries (deleted/renamed releases) silently
          # poisoning the manifest. Fail the job before we commit if any
          # listed asset 404s — including the one we just published, which
          # catches release-asset propagation lag.
          fail=0
          for url in $(jq -r '.[0].versions[].sourceUrl' manifest.json); do
            for attempt in 1 2 3; do
              code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 15 "$url" || echo 000)
              if [ "$code" = "200" ]; then
                echo "OK  $url"
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "retry $attempt: $code $url"
                sleep $((attempt * 3))
              else
                echo "::error::Unreachable ($code): $url"
                fail=1
              fi
            done
          done
          exit $fail

      - name: Commit updated manifest to manifest branch
        # manifest.json lives on its own orphan `manifest` branch so the release
        # workflow doesn't churn main. The branch contains only manifest.json
        # (no source, no history from main). Jellyfin consumers point at the
        # raw URL on the `manifest` branch, e.g.
        #   ${{ github.server_url }}/${{ github.repository }}/raw/branch/manifest/manifest.json
        run: |
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@noreply.${{ github.server_url }}"
          cp manifest.json /tmp/manifest.json

          if git ls-remote --exit-code --heads origin manifest >/dev/null 2>&1; then
            git fetch origin manifest
            # -f discards anything dirty from the tag checkout
            git checkout -f -B manifest origin/manifest
          else
            echo "Creating orphan manifest branch"
            git checkout --orphan manifest
            git rm -rf --cached . >/dev/null 2>&1 || true
            # Wipe the working tree so the orphan branch contains only manifest.json
            find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          fi

          cp /tmp/manifest.json manifest.json
          git add manifest.json
          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
            exit 0
          fi
          git commit -m "Update manifest.json for ${GITHUB_REF_NAME}"
          # Push directly to the canonical URL with the token inline.
          # Background: actions/checkout sets `origin` to https://git.s10y.ca/...
          # (the runner's github.server_url), which 302-redirects to
          # https://forgejo.singerfamily.ca. Git follows the redirect for fetches
          # but STRIPS the Authorization header on cross-host redirect, so a
          # `git push origin` prompts for a username and fails. Bypass by pushing
          # to the canonical URL with the token embedded — the runner masks
          # secrets.GITHUB_TOKEN in logs.
          PUSH_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@forgejo.singerfamily.ca/${{ github.repository }}"
          # Retry to survive concurrent pushes during the build.
          # No --force: this job is the only manifest writer. If a concurrent push
          # exists, rebase + retry cleanly; do NOT swallow rebase failures.
          for i in 1 2 3; do
            if git push "$PUSH_URL" manifest; then
              exit 0
            fi
            echo "Push failed, rebasing and retrying ($i/3)..."
            git pull --rebase origin manifest
            sleep $((i * 2))
          done
          echo "::error::Failed to push manifest update after 3 attempts"
          exit 1
